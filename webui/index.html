<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSS 管理系统</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 1500px; margin: 0 auto; padding: 16px; background: #f5f5f7; color: #333; font-size: 14px; }
  h1 { margin: 0 0 16px; font-size: 22px; }
  .toolbar { position: sticky; top: 0; z-index: 10; background: #fff; padding: 12px 16px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08); margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar .sep { flex: 1; }
  button { padding: 7px 14px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; transition: .15s; font-family: inherit; }
  button:hover:not(:disabled) { opacity: .88; }
  button.primary { background: #007aff; color: #fff; }
  button.success { background: #34c759; color: #fff; }
  button.warn    { background: #ff9500; color: #fff; }
  button.danger  { background: #ff3b30; color: #fff; }
  button.gray    { background: #8e8e93; color: #fff; }
  button.small   { padding: 4px 10px; font-size: 12px; }
  table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
  th { background: #fafafa; font-weight: 600; white-space: nowrap; font-size: 13px; }
  tr.repo-row:hover { background: #f9f9fb; }
  tr.repo-row.expanded { background: #f0f6ff; }
  .repo-name { font-family: monospace; font-weight: 600; color: #007aff; }
  a.repo-link { text-decoration: none; }
  a.repo-link:hover { text-decoration: underline; }
  .cron-badge { display: inline-block; padding: 2px 8px; background: #eef; color: #335; border-radius: 10px; font-family: monospace; font-size: 12px; margin-right: 4px; }
  .status-ok { color: #34c759; font-weight: 600; } .status-bad { color: #ff3b30; font-weight: 600; } .status-warn { color: #ff9500; font-weight: 600; } .status-off { color: #8e8e93; }
  .health-dot { display: inline-block; font-size: 18px; cursor: pointer; user-select: none; line-height: 1; }
  .health-dot.green { color: #34c759; } .health-dot.yellow { color: #ff9500; } .health-dot.red { color: #ff3b30; } .health-dot.gray { color: #ccc; }
  input[type="text"], input[type="number"], select { padding: 5px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; font-family: inherit; background: #fff; }
  input:focus { outline: none; border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,.15); }
  input.cron-input { width: 130px; font-family: monospace; } input.num-input { width: 80px; }
  .detail-row { display: none; } .detail-row.visible { display: table-row; } .detail-row > td { padding: 0; background: #f8faff; }
  .detail-panel { padding: 16px 20px; border-top: 1px solid #d5e3ff; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .detail-section { background: #fff; padding: 14px 16px; border-radius: 8px; border: 1px solid #e0e8f5; }
  .detail-section h4 { margin: 0 0 10px; font-size: 13px; color: #007aff; text-transform: uppercase; letter-spacing: .5px; }
  .form-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
  .form-row label { flex: 0 0 90px; font-size: 13px; color: #666; }
  .form-row input, .form-row select { flex: 1; } .form-row .hint { font-size: 12px; color: #999; }
  .progress-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .progress-line .label { flex: 0 0 60px; font-size: 13px; color: #666; }
  .progress-line .count { font-family: monospace; color: #888; }
  .progress-bar { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin: 0 4px; }
  .progress-bar > div { height: 100%; background: #34c759; transition: width .3s; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-bg.visible { display: flex; }
  .modal { background: #fff; border-radius: 10px; max-width: 900px; width: 92%; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { margin: 0; font-size: 16px; }
  .modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 8px; justify-content: flex-end; }
  .modal-toolbar { padding: 10px 20px; background: #f9f9fb; border-bottom: 1px solid #eee; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .book-list { border: 1px solid #e0e0e0; border-radius: 6px; max-height: 400px; overflow-y: auto; }
  .book-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .book-item:last-child { border-bottom: none; } .book-item.dragging { opacity: .4; } .book-item.drag-over { border-top: 2px solid #007aff; }
  .book-item .drag-handle { cursor: grab; color: #bbb; font-size: 16px; user-select: none; padding: 0 4px; }
  .book-item .idx { flex: 0 0 40px; color: #999; font-family: monospace; font-size: 12px; }
  .book-item .name { flex: 1; word-break: break-all; } .book-item .name.done { color: #aaa; text-decoration: line-through; }
  .book-item .actions { display: flex; gap: 4px; }
  .section-title { font-size: 13px; font-weight: 600; color: #666; margin: 14px 0 6px; display: flex; align-items: center; gap: 10px; }
  .empty-hint { padding: 20px; text-align: center; color: #999; font-size: 13px; }
  #log { margin: 16px 0; padding: 12px; background: #1e1e1e; color: #d4d4d4; border-radius: 8px; font-family: Consolas, monospace; font-size: 12px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; display: none; }
  #log.visible { display: block; }
  .task-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fafbff; border: 1px solid #e0e8f5; border-radius: 8px; margin-bottom: 10px; }
  .task-row .task-label { flex: 0 0 120px; font-weight: 600; color: #007aff; font-size: 14px; }
  .task-row .task-lang { flex: 0 0 50px; font-size: 12px; color: #666; background: #eef; border-radius: 4px; padding: 2px 6px; text-align: center; }
  .task-row .task-cron { flex: 0 0 130px; font-family: monospace; font-size: 12px; color: #335; }
  .task-row .task-progress { flex: 1; display: flex; align-items: center; gap: 6px; }
  .health-row { display: flex; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .health-row:last-child { border-bottom: none; } .health-row .k { flex: 0 0 100px; color: #666; font-weight: 600; } .health-row .v { flex: 1; }
  .health-icon-ok { color: #34c759; } .health-icon-warn { color: #ff9500; } .health-icon-bad { color: #ff3b30; }
  .health-suggestion { background: #fff8e6; border-left: 3px solid #ff9500; padding: 8px 12px; margin: 6px 0; border-radius: 4px; font-size: 13px; }
  .hint { color: #888; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<h1>RSS 学习管理系统</h1>

<div class="toolbar">
  <button class="primary" onclick="saveConfig()">💾 保存配置</button>
  <button class="success" onclick="applyAll()">⚙️ 应用到各仓库</button>
  <button class="danger" onclick="pushAll()">📤 批量 Push</button>
  <select id="gearSelect" onchange="applyGear(this.value)" style="padding:7px 10px;font-size:13px;border-radius:6px;border:1px solid #ddd;font-family:inherit;cursor:pointer">
    <option value="">切换档位...</option>
    <option value="0">停车 (全停)</option>
    <option value="1">微速进</option>
    <option value="2">前进一</option>
    <option value="3">前进二</option>
    <option value="4">前进三</option>
  </select>
  <span class="sep"></span>
  <button class="warn" onclick="syncProgressAll()">🔄 同步进度</button>
  <button class="warn" onclick="checkHealthAll()">🏥 全部检查</button>
  <span class="sep"></span>
  <button class="gray" onclick="reload()">🔄 刷新</button>
  <button class="gray" onclick="toggleLog()">📋 日志</button>
</div>

<div id="log"></div>

<table>
  <thead>
    <tr>
      <th style="width:30px"><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
      <th style="width:200px">仓库</th>
      <th>标题</th>
      <th style="width:110px; text-align:center;">EPUB</th>
      <th style="width:110px; text-align:center;">CSV</th>
      <th style="width:60px">健康</th>
      <th style="width:120px">状态</th>
      <th style="width:60px">操作</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="8" style="text-align:center;padding:40px;color:#999">加载中...</td></tr>
  </tbody>
</table>

<div class="modal-bg" id="booksModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="booksModalTitle">书籍管理</h3>
      <button class="gray small" onclick="closeBooksModal()">✕</button>
    </div>
    <div class="modal-toolbar">
      <button class="primary small" onclick="rebuildManifest()">🔄 从目录重建 manifest</button>
      <button class="gray small" onclick="refreshBooks()">↻ 刷新</button>
      <span class="hint">资源管理器换完书后，点「重建」</span>
    </div>
    <div class="modal-body" id="booksModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeBooksModal()">取消</button>
      <button class="primary" onclick="saveBookOrder()">保存顺序</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="healthModal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3 id="healthModalTitle">健康检查</h3>
      <button class="gray small" onclick="closeHealthModal()">✕</button>
    </div>
    <div class="modal-body" id="healthModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeHealthModal()">关闭</button>
      <button class="primary" onclick="rerunHealthCheck()">重新检查</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="taskModal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <h3 id="taskModalTitle">编辑任务</h3>
      <button class="gray small" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="modal-body" id="taskModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeTaskModal()">取消</button>
      <button class="primary" onclick="saveTaskConfig()">保存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="createTaskModal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3>新建 CSV 任务</h3>
      <button class="gray small" onclick="closeCreateTaskModal()">✕</button>
    </div>
    <div class="modal-body" id="createTaskModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeCreateTaskModal()">取消</button>
      <button class="primary" onclick="submitCreateTask()">创建</button>
    </div>
  </div>
</div>

<script>
let config = null, repoInfos = {}, statuses = {}, healths = {};
let currentBooksRepo = null, currentBookList = null, currentHealthRepo = null, pendingProgress = null;
let currentTaskRepo = null, currentTaskId = null, currentTaskData = null;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const text = await r.text();
  try { return JSON.parse(text); } catch { return { raw: text }; }
}
function log(msg) { const el = document.getElementById('log'); el.classList.add('visible'); el.textContent += msg + '\n'; el.scrollTop = el.scrollHeight; }
function toggleLog() { document.getElementById('log').classList.toggle('visible'); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function fmtCron(c) { return '<span class="cron-badge">' + escapeHtml(c || '—') + '</span>'; }

async function reload() {
  config = await api('/api/config'); statuses = await api('/api/status'); repoInfos = {};
  for (const name of Object.keys(config.repos || {})) { repoInfos[name] = await api('/api/repo-info/' + name); }
  render();
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  for (const [name, cfg] of Object.entries(config.repos || {})) {
    const info = repoInfos[name] || {}, st = statuses[name] || {}, health = healths[name] || null;
    const isTaskRepo = info.tasks && info.tasks.length > 0;
    
    let statusHtml = '<span class="status-off">未知</span>';
    if (!st.exists) { statusHtml = '<span class="status-bad">目录缺失</span>'; } 
    else {
      const parts = [];
      if (st.ahead > 0) parts.push('<span class="status-warn">未推 ' + st.ahead + '</span>');
      if (st.local > 0) parts.push('<span class="status-warn">本地改 ' + st.local + '</span>');
      statusHtml = parts.length ? parts.join(' / ') : '<span class="status-ok">干净</span>';
    }
    
    let healthHtml = '<span class="health-dot gray">⚪</span>';
    if (health) { const icon = health.level === 'green' ? '🟢' : health.level === 'yellow' ? '🟡' : '🔴'; healthHtml = '<span class="health-dot ' + health.level + '" onclick="openHealthModal(\'' + name + '\')">' + icon + '</span>'; }
    
    const enabled = cfg.enabled !== false;
    let epubCol, csvCol;
    if (isTaskRepo) {
      epubCol = '<span class="cron-badge">任务</span><span class="status-off"> / </span><span class="cron-badge">CSV</span>';
      csvCol = '<span class="cron-badge">' + info.tasks.length + ' 个</span>';
    } else {
      epubCol = fmtCron(cfg.cron?.epub); csvCol = fmtCron(cfg.cron?.csv);
    }
    
    const tr = document.createElement('tr'); tr.className = 'repo-row'; tr.dataset.repo = name;
    tr.innerHTML = `<td><input type="checkbox" class="row-check" data-repo="${name}"></td>
      <td><a class="repo-name repo-link" href="https://github.com/ZHENHUA001A307/${escapeHtml(name)}" target="_blank" rel="noopener">${escapeHtml(name)}</a> ${enabled ? '' : '<span class="status-off" style="font-size:11px">(已停)</span>'}</td>
      <td>${escapeHtml(cfg.feed?.title || '')}</td>
      <td style="text-align:center">${epubCol}</td>
      <td style="text-align:center">${csvCol}</td>
      <td>${healthHtml}</td>
      <td class="status-cell">${statusHtml}</td>
      <td><button class="gray small" onclick="toggleDetail('${name}', this)">▼</button></td>`;
    tbody.appendChild(tr);
    
    const dr = document.createElement('tr'); dr.className = 'detail-row'; dr.dataset.detail = name;
    dr.innerHTML = `<td colspan="8">${renderDetail(name, cfg, info)}</td>`;
    tbody.appendChild(dr);
  }
}

function renderDetail(name, cfg, info) {
  if (info.tasks && info.tasks.length > 0) return renderTaskDetail(name, cfg, info);
  const epubTotal = info.epub?.total || 0, epubProg = info.epub?.progress || 0, epubDis = info.epub?.disabled || 0;
  const csvTotal = info.csv?.total || 0, csvProg = info.csv?.progress || 0;
  const epubPct = epubTotal > 0 ? Math.min(100, epubProg / epubTotal * 100) : 0;
  const csvPct = csvTotal > 0 ? Math.min(100, csvProg / csvTotal * 100) : 0;
  
  return `<div class="detail-panel">
    <div class="detail-section"><h4>基础</h4>
      <div class="form-row"><label>标题</label><input type="text" data-repo="${name}" data-field="title" value="${escapeHtml(cfg.feed?.title || '')}"></div>
      <div class="form-row"><label>描述</label><input type="text" data-repo="${name}" data-field="description" value="${escapeHtml(cfg.feed?.description || '')}"></div>
      <div class="form-row"><label>启用</label><input type="checkbox" data-repo="${name}" data-field="enabled" ${cfg.enabled !== false ? 'checked' : ''}><span class="hint">关闭后不按 cron 自动跑</span></div>
    </div>
    <div class="detail-section"><h4>推送时间（UTC）</h4>
      <div class="form-row"><label>EPUB</label><input type="text" class="cron-input" data-repo="${name}" data-field="cron_epub" value="${escapeHtml(cfg.cron?.epub || '')}"></div>
      <div class="form-row"><label>CSV</label><input type="text" class="cron-input" data-repo="${name}" data-field="cron_csv" value="${escapeHtml(cfg.cron?.csv || '')}"></div>
    </div>
    <div class="detail-section"><h4>进度</h4>
      <div class="progress-line"><span class="label">EPUB</span><div class="progress-bar"><div style="width:${epubPct}%"></div></div><span class="count">${epubProg} / ${epubTotal}</span><input type="number" class="num-input" style="width:60px" data-repo="${name}" data-field="progress_epub" value="${epubProg}"><button class="gray small" onclick="resetProgress('${name}','epub')">重置</button></div>
      <div class="progress-line"><span class="label">CSV</span><div class="progress-bar"><div style="width:${csvPct}%"></div></div><span class="count">${csvProg} / ${csvTotal}</span><input type="number" class="num-input" style="width:60px" data-repo="${name}" data-field="progress_csv" value="${csvProg}"><button class="gray small" onclick="resetProgress('${name}','csv')">重置</button></div>
      <div class="btn-row"><button class="primary small" onclick="saveProgress('${name}')">保存进度</button><button class="warn small" onclick="syncProgressOne('${name}')">🔄 拉远程进度</button></div>
    </div>
    <div class="detail-section"><h4>内容管理</h4>
      <div class="btn-row"><button class="gray small" onclick="openBooksModal('${name}')">📚 管理 EPUB 书籍 (${epubTotal} 启用 / ${epubDis} 搁置)</button></div>
      <div class="hint">CSV 请用本地编辑器直接改 data/source.csv</div>
    </div>
    <div class="detail-section"><h4>快捷操作</h4>
      <div class="btn-row"><button class="success small" onclick="triggerWorkflow('${name}','epub')">▶ 触发 EPUB</button><button class="success small" onclick="triggerWorkflow('${name}','csv')">▶ 触发 CSV</button></div>
      <div class="btn-row"><button class="gray small" onclick="openHealthModal('${name}')">🏥 检查健康</button><button class="gray small" onclick="window.open('https://github.com/ZHENHUA001A307/${name}/actions','_blank')">GitHub Actions</button></div>
    </div>
  </div>`;
}

function renderTaskDetail(name, cfg, info) {
  let taskRows = '';
  for (const t of info.tasks) {
    const total = t.total || 0, prog = t.progress || 0, pct = total > 0 ? Math.min(100, prog / total * 100) : 0;
    const safeId = t.id.replace(/'/g, "\\'");
    taskRows += `<div class="task-row">
        <div class="task-label">${escapeHtml(t.label)}</div>
        <div class="task-lang">${escapeHtml(t.lang)}</div>
        <div class="task-cron">${escapeHtml(t.cron)}</div>
        <div class="task-progress"><div class="progress-bar"><div style="width:${pct}%"></div></div><span class="count">${prog} / ${total}</span>${t.type === 'llm' ? '<span class="hint">batch=' + t.batch_size + '</span>' : ''}</div>
        <div class="task-actions">
          <button class="gray small" onclick="openTaskModal('${name}', '${safeId}')">✏️ 配置</button>
          <button class="primary small" onclick="editTaskProgress('${name}', '${safeId}', ${prog}, ${total})">改进度</button>
          <button class="gray small" onclick="resetTaskProgress('${name}', '${safeId}')">重置</button>
          <button class="success small" onclick="triggerTask('${name}', '${safeId}')">▶ 触发</button>
          <button class="warn small" onclick="syncProgressOne('${name}')">🔄 拉进度</button>
          <button class="danger small" onclick="deleteTask('${name}', '${safeId}')">删除</button>
        </div>
    </div>`;
  }
  
  return `<div class="detail-panel" style="grid-template-columns: 1fr;">
    <div class="detail-section"><h4>基础</h4>
      <div class="form-row"><label>标题</label><input type="text" data-repo="${name}" data-field="title" value="${escapeHtml(cfg.feed?.title || '')}"></div>
      <div class="form-row"><label>描述</label><input type="text" data-repo="${name}" data-field="description" value="${escapeHtml(cfg.feed?.description || '')}"></div>
      <div class="form-row"><label>启用</label><input type="checkbox" data-repo="${name}" data-field="enabled" ${cfg.enabled !== false ? 'checked' : ''}><span class="hint">关闭后所有任务不按 cron 自动跑</span></div>
    </div>
    <div class="detail-section"><h4>任务列表（${info.tasks.length}）</h4>
      ${taskRows || '<div class="empty-hint">无任务</div>'}
      <div class="btn-row" style="margin-top:12px"><button class="primary small" onclick="openCreateTaskModal('${name}')">+ 添加 CSV 任务</button></div>
    </div>
    <div class="detail-section"><h4>快捷操作</h4>
      <div class="btn-row"><button class="gray small" onclick="openHealthModal('${name}')">🏥 检查健康</button><button class="gray small" onclick="window.open('https://github.com/ZHENHUA001A307/${name}/actions','_blank')">GitHub Actions</button></div>
    </div>
  </div>`;
}

function toggleDetail(name, btn) {
  const row = document.querySelector(`tr[data-detail="${name}"]`), mainRow = document.querySelector(`tr[data-repo="${name}"]`);
  const visible = row.classList.toggle('visible'); mainRow.classList.toggle('expanded', visible); btn.textContent = visible ? '▲' : '▼';
}

function collectEdits() {
  document.querySelectorAll('.detail-row input[data-repo]').forEach(inp => {
    const repo = inp.dataset.repo, field = inp.dataset.field, cfg = config.repos[repo];
    if (!cfg) return;
    if (field === 'title')       { cfg.feed = cfg.feed || {}; cfg.feed.title = inp.value; }
    if (field === 'description') { cfg.feed = cfg.feed || {}; cfg.feed.description = inp.value; }
    if (field === 'enabled')     { cfg.enabled = inp.checked; }
    if (field === 'cron_epub')   { cfg.cron = cfg.cron || {}; cfg.cron.epub = inp.value; }
    if (field === 'cron_csv')    { cfg.cron = cfg.cron || {}; cfg.cron.csv = inp.value; }
  });
}

async function saveConfig() {
  collectEdits();
  const r = await api('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(config) });
  log(r.ok ? '✅ 配置已保存' : '❌ 保存失败：' + r.error);
  if (r.ok) await reload();
}

async function resetProgress(name, mode) { if (confirm(`确定把 ${name} 的 ${mode.toUpperCase()} 进度重置为 0？`)) { pendingProgress = { name, mode, value: 0 }; await doProgressChange(); } }
async function doProgressChange() {
  const { name, mode, value } = pendingProgress;
  await api(`/api/progress/${name}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mode, value }) });
  log(`✅ 进度已改为 ${value}`); pendingProgress = null; await reload();
}

async function saveProgress(name) {
  const inp = document.querySelector(`input[data-repo="${name}"][data-field="progress_epub"]`), inpCsv = document.querySelector(`input[data-repo="${name}"][data-field="progress_csv"]`);
  const info = repoInfos[name], origEpub = info.epub?.progress || 0, origCsv = info.csv?.progress || 0;
  const tasks = [];
  if (parseInt(inp.value) !== origEpub) tasks.push({ mode: 'epub', value: parseInt(inp.value) || 0 });
  if (parseInt(inpCsv.value) !== origCsv) tasks.push({ mode: 'csv', value: parseInt(inpCsv.value) || 0 });
  
  for (const t of tasks) {
    const r = await api(`/api/progress/${name}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(t) });
    log(r.ok ? `✅ 进度已改为 ${t.value}` : `❌ 失败`);
  }
  await reload();
}

function getTaskType(repoName, taskId) { const cfg = config.repos[repoName]; return cfg && cfg.tasks ? (cfg.tasks.find(x => x.id === taskId)?.type || '') : ''; }
function slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

function openTaskModal(name, taskId) {
  currentTaskRepo = name; currentTaskId = taskId;
  const info = repoInfos[name]; if (!info || !info.tasks) return;
  const task = info.tasks.find(t => t.id === taskId); if (!task) return;
  const cfgTask = (config.repos[name].tasks || []).find(t => t.id === taskId) || {};
  
  currentTaskData = {
    label: cfgTask.label || task.label, lang: cfgTask.lang || task.lang, cron: cfgTask.cron || task.cron,
    batch_size: cfgTask.batch_size || task.batch_size || 15, slice_mode: cfgTask.slice_mode || 'by_count',
    input_file: cfgTask.input_file || '', progress_file: cfgTask.progress_file || '', prompt_file: cfgTask.prompt_file || '', model_name: cfgTask.model_name || 'deepseek-v4-pro',
    type: cfgTask.type || task.type || 'llm'
  };
  document.getElementById('taskModalTitle').textContent = '编辑任务：' + currentTaskData.label;
  renderTaskModal(); document.getElementById('taskModal').classList.add('visible');
}

function closeTaskModal() { document.getElementById('taskModal').classList.remove('visible'); currentTaskRepo = currentTaskId = currentTaskData = null; }

function renderTaskModal() {
  const d = currentTaskData, isLlm = d.type === 'llm';
  let html = `<div class="form-row"><label>显示名</label><input type="text" id="tf_label" value="${escapeHtml(d.label)}"></div>
    <div class="form-row"><label>语言前缀</label><input type="text" id="tf_lang" value="${escapeHtml(d.lang)}"></div>
    <div class="form-row"><label>Cron</label><input type="text" class="cron-input" id="tf_cron" value="${escapeHtml(d.cron)}"></div>`;
  if (isLlm) html += `<div class="form-row"><label>批次大小</label><input type="number" id="tf_batch" value="${d.batch_size}"></div>
    <div class="form-row"><label>切片模式</label><select id="tf_slice"><option value="by_count" ${d.slice_mode === 'by_count' ? 'selected' : ''}>by_count</option><option value="by_topic" ${d.slice_mode === 'by_topic' ? 'selected' : ''}>by_topic</option></select></div>`;
  html += `<div class="form-row"><label>输入文件</label><input type="text" id="tf_input" value="${escapeHtml(d.input_file)}"></div>
    <div class="form-row"><label>进度文件</label><input type="text" id="tf_progress" value="${escapeHtml(d.progress_file)}"></div>`;
  if (isLlm) html += `<div class="form-row"><label>提示词文件</label><input type="text" id="tf_prompt" value="${escapeHtml(d.prompt_file)}"></div>
    <div class="form-row"><label>模型</label><input type="text" id="tf_model" value="${escapeHtml(d.model_name)}"></div>`;
  document.getElementById('taskModalBody').innerHTML = html;
}

async function saveTaskConfig() {
  if (!currentTaskRepo || !currentTaskId) return;
  const fields = { label: document.getElementById('tf_label').value.trim(), lang: document.getElementById('tf_lang').value.trim(), cron: document.getElementById('tf_cron').value.trim(), input_file: document.getElementById('tf_input').value.trim(), progress_file: document.getElementById('tf_progress').value.trim() };
  if (currentTaskData.type === 'llm') { Object.assign(fields, { batch_size: parseInt(document.getElementById('tf_batch').value) || 15, slice_mode: document.getElementById('tf_slice').value, prompt_file: document.getElementById('tf_prompt').value.trim(), model_name: document.getElementById('tf_model').value.trim() }); }
  if (fields.progress_file !== currentTaskData.progress_file && !confirm('修改了进度文件路径，相当于切换进度指针，确定？')) return;
  const r = await api(`/api/task-config/${currentTaskRepo}/${currentTaskId}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(fields) });
  if (!r.ok) return log('❌ ' + r.error);
  log('✅ ' + r.output); closeTaskModal(); await reload();
}

async function resetTaskProgress(name, taskId) {
  if (!confirm(`确定要将 ${taskId} 的进度重置为 0 吗？`)) return;
  await api(`/api/task-progress/${name}/${taskId}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ value: 0 }) });
  log('✅ 进度已重置为 0');
  await reload();
}

async function editTaskProgress(name, taskId, current, total) {
  let input = prompt(`输入新的进度值（当前 ${current} / ${total}）`, current); if (input === null) return;
  let finalVal = parseInt(input); if (isNaN(finalVal) || finalVal < 0) return log('❌ 无效数字');
  if (finalVal > total && !confirm(`超过总量 ${total}，将重置为 0。继续？`)) return; if (finalVal > total) finalVal = 0;
  await api(`/api/task-progress/${name}/${taskId}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ value: finalVal }) });
  log(`✅ 进度已改为 ${finalVal}`); await reload();
}

function openCreateTaskModal(repoName) {
  currentTaskRepo = repoName;
  document.getElementById('createTaskModalBody').innerHTML = `<div class="form-row"><label>显示名</label><input type="text" id="ct_label" oninput="document.getElementById('ct_id').value = slugify(this.value)"></div>
    <div class="form-row"><label>ID</label><input type="text" id="ct_id"></div>
    <div class="form-row"><label>语言前缀</label><input type="text" id="ct_lang" value="英语"></div>
    <div class="form-row"><label>Cron</label><input type="text" class="cron-input" id="ct_cron" value="0 0 * * 3"></div>
    <div class="form-row"><label>输入文件</label><input type="text" id="ct_input" placeholder="corpus/xxx.csv"></div>
    <div class="form-row"><label>进度文件</label><input type="text" id="ct_progress" placeholder="progress/xxx.txt"></div>`;
  document.getElementById('createTaskModal').classList.add('visible');
}

function closeCreateTaskModal() { document.getElementById('createTaskModal').classList.remove('visible'); currentTaskRepo = null; }

async function submitCreateTask() {
  if (!currentTaskRepo) return;
  const fields = { label: document.getElementById('ct_label').value.trim(), id: document.getElementById('ct_id').value.trim(), lang: document.getElementById('ct_lang').value.trim(), cron: document.getElementById('ct_cron').value.trim(), input_file: document.getElementById('ct_input').value.trim(), progress_file: document.getElementById('ct_progress').value.trim() };
  if (!fields.label || !fields.id) return log('❌ 显示名和ID必填');
  const r = await api('/api/create-csv-task/' + currentTaskRepo, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(fields) });
  if (!r.ok) return log('❌ ' + (r.error || r.output));
  log('✅ ' + r.output); closeCreateTaskModal(); await reload();
}

async function deleteTask(name, taskId) {
  if (!confirm(`删除任务 ${taskId}？`)) return;
  const r = await api(`/api/delete-csv-task/${name}/${taskId}`, { method: 'POST' });
  if (!r.ok) return log('❌ ' + (r.error || r.output));
  log('✅ ' + r.output); await reload();
}

async function triggerTask(name, taskId) {
  if (!confirm(`触发任务 ${taskId}？`)) return; log('⏳ 触发中...');
  const r = await api(`/api/trigger-task/${name}/${taskId}`, { method: 'POST' });
  log(r.ok ? '✅ 已触发' : '❌ ' + r.error);
}

async function triggerWorkflow(name, mode) {
  if (!confirm(`触发 ${name} 的 ${mode}？`)) return; log('⏳ 触发中...');
  const r = await api(`/api/workflow/${name}/${mode}`, { method: 'POST' });
  log(r.ok ? '✅ 已触发' : '❌ ' + r.error);
}

async function applyGear(gear) {
  const sel = document.getElementById('gearSelect'); if (!gear) return;
  const label = { "0": "停车", "1": "微速进", "2": "前进一", "3": "前进二", "4": "前进三" }[gear];
  if (!confirm(`切换到 ${label}？\n这会覆盖所有仓库本地 cron，请随后手动 Push。`)) { sel.value = ""; return; }
  log(`⏳ 应用档位 ${gear}...`);
  const r = await api('/api/apply-gear', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ gear }) });
  if (r.raw) {
    log('❌ 服务器异常 (非JSON): ' + r.raw);
  } else if (!r.ok) {
    log('❌ 失败: ' + (r.error || r.output || '未知错误'));
  } else {
    log(r.output || '');
    log('✅ 档位已应用');
  }
  sel.value = ""; await reload();
}

async function applyAll() {
  await saveConfig();
  log('⏳ 应用到各仓库...');
  const r = await api('/api/apply', { method: 'POST' });
  if (r.raw) {
    log('❌ 服务器异常 (非JSON): ' + r.raw);
  } else if (!r.ok) {
    log('❌ 失败: ' + (r.error || r.output || '未知错误'));
  } else {
    log(r.output || '');
    log('✅ 应用完成');
  }
  await reload();
}
async function pushAll() {
  if (!confirm('批量 Push 所有仓库？')) return;
  log('⏳ 批量 Push...');
  const r = await api('/api/push', { method: 'POST' });
  if (r.raw) {
    log('❌ 服务器异常 (非JSON): ' + r.raw);
  } else if (!r.ok) {
    log('❌ 失败: ' + (r.error || r.output || '未知错误'));
  } else {
    log(r.output || '');
    log('✅ Push 完成');
  }
  await reload();
}
function toggleAll(cb) { document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked); }

async function syncProgressOne(name) { log('⏳ 同步中...'); const r = await api(`/api/sync-progress/${name}`, { method: 'POST' }); log(r.ok ? '✅ 同步完成' : '❌ ' + r.output); await reload(); }
async function syncProgressAll() { if (!confirm('同步所有进度？')) return; log('⏳ 同步所有...'); const r = await api('/api/sync-progress-all', { method: 'POST' }); log(r.output); log('✅ 同步完成'); await reload(); }

async function checkHealthAll() { log('⏳ 检查健康...'); healths = await api('/api/health-all'); log('✅ 检查完成'); render(); }
async function openHealthModal(name) {
  currentHealthRepo = name; document.getElementById('healthModalTitle').textContent = name + ' - 健康';
  document.getElementById('healthModalBody').innerHTML = '加载中...'; document.getElementById('healthModal').classList.add('visible');
  if (!healths[name]) healths[name] = await api('/api/health/' + name); renderHealthModal();
}
async function rerunHealthCheck() { if (currentHealthRepo) { healths[currentHealthRepo] = await api('/api/health/' + currentHealthRepo); renderHealthModal(); render(); } }
function closeHealthModal() { document.getElementById('healthModal').classList.remove('visible'); currentHealthRepo = null; }
function icon(ok) { return ok === true ? '<span class="health-icon-ok">✓</span>' : ok === false ? '<span class="health-icon-bad">✗</span>' : '<span class="health-icon-warn">?</span>'; }

function renderHealthModal() {
  const h = healths[currentHealthRepo]; if (!h) return;
  let html = `<div style="text-align:center;font-size:24px;margin-bottom:16px">${h.level === 'green' ? '🟢' : h.level === 'yellow' ? '🟡' : '🔴'}</div>
    <div class="health-row"><span class="k">Actions</span><span class="v">${icon(h.actions.ok)} ${escapeHtml(h.actions.msg)}</span></div>
    <div class="health-row"><span class="k">Git</span><span class="v">${icon(h.git.ok)} ${escapeHtml(h.git.msg)}</span></div>
    <div class="health-row"><span class="k">Feed</span><span class="v">${icon(h.feed.ok)} ${escapeHtml(h.feed.msg)}</span></div>
    <div class="health-row"><span class="k">Network</span><span class="v">${icon(h.network.ok)} ${escapeHtml(h.network.msg)}</span></div>`;
  document.getElementById('healthModalBody').innerHTML = html;
}

async function openBooksModal(name) { currentBooksRepo = name; document.getElementById('booksModalTitle').textContent = name + ' - 书籍'; document.getElementById('booksModal').classList.add('visible'); currentBookList = await api('/api/books/' + name); renderBooksModal(); }
function closeBooksModal() { document.getElementById('booksModal').classList.remove('visible'); currentBooksRepo = null; }
async function refreshBooks() { if (currentBooksRepo) { currentBookList = await api('/api/books/' + currentBooksRepo); renderBooksModal(); await reload(); } }
async function rebuildManifest() { if (confirm('重建 manifest？')) { const r = await api(`/api/books/${currentBooksRepo}/rebuild-manifest`, { method: 'POST' }); log('✅ ' + r.output); await refreshBooks(); } }
function renderBooksModal() {
  const { enabled, disabled, orphans } = currentBookList; let html = `<div class="section-title">启用 (${enabled.length})</div><div class="book-list" id="enabledList">`;
  for (const it of enabled) html += `<div class="book-item" draggable="true" data-file="${escapeHtml(it.file)}"><span class="drag-handle">⠿</span><span class="idx">${it.index}</span><span class="name">${escapeHtml(it.title || it.file)}</span><span class="actions"><button class="gray small" onclick="disableBook('${escapeHtml(it.file)}')">搁置</button></span></div>`;
  html += `</div>`;
  if (disabled.length) { html += `<div class="section-title">搁置 (${disabled.length})</div><div class="book-list">`; for (const it of disabled) html += `<div class="book-item"><span class="name">${escapeHtml(it.title || it.file)}</span><span class="actions"><button class="success small" onclick="enableBook('${escapeHtml(it.file)}')">恢复</button><button class="danger small" onclick="deleteBook('${escapeHtml(it.file)}')">删除</button></span></div>`; html += `</div>`; }
  document.getElementById('booksModalBody').innerHTML = html; setupDragDrop();
}
function setupDragDrop() {
  const list = document.getElementById('enabledList'); if (!list) return; let dragEl = null;
  list.querySelectorAll('.book-item').forEach(el => {
    el.addEventListener('dragstart', () => { dragEl = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); list.querySelectorAll('.book-item').forEach(x => x.classList.remove('drag-over')); });
    el.addEventListener('dragover', e => { e.preventDefault(); if (el !== dragEl) el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag-over'); if (el !== dragEl) { if ([...list.querySelectorAll('.book-item')].indexOf(dragEl) < [...list.querySelectorAll('.book-item')].indexOf(el)) el.after(dragEl); else el.before(dragEl); [...list.querySelectorAll('.book-item')].forEach((it, i) => it.querySelector('.idx').textContent = i + 1); } });
  });
}
async function saveBookOrder() { const files = [...document.querySelectorAll('#enabledList .book-item')].map(el => el.dataset.file); await api(`/api/books/${currentBooksRepo}/reorder`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ files }) }); log('✅ 顺序已保存'); closeBooksModal(); await reload(); }
async function disableBook(f) { await api(`/api/books/${currentBooksRepo}/disable`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ file: f }) }); await refreshBooks(); }
async function enableBook(f) { await api(`/api/books/${currentBooksRepo}/enable`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ file: f }) }); await refreshBooks(); }
async function deleteBook(f) { if (confirm('彻底删除？')) { await api(`/api/books/${currentBooksRepo}/delete`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ file: f }) }); await refreshBooks(); } }

(async () => { try { await reload(); } catch (e) { document.getElementById('tbody').innerHTML = `<tr><td colspan="8" style="text-align:center;color:red">加载失败：${e.message}</td></tr>`; } })();
</script>
