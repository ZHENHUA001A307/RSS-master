<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSS 管理系统</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 1500px; margin: 0 auto; padding: 16px;
    background: #f5f5f7; color: #333; font-size: 14px;
  }
  h1 { margin: 0 0 16px; font-size: 22px; }
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; padding: 12px 16px;
    border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
    margin-bottom: 16px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .toolbar .sep { flex: 1; }
  button {
    padding: 7px 14px; font-size: 13px;
    border: none; border-radius: 6px;
    cursor: pointer; transition: .15s;
    font-family: inherit;
  }
  button:hover:not(:disabled) { opacity: .88; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #007aff; color: #fff; }
  button.success { background: #34c759; color: #fff; }
  button.warn    { background: #ff9500; color: #fff; }
  button.danger  { background: #ff3b30; color: #fff; }
  button.gray    { background: #8e8e93; color: #fff; }
  button.small   { padding: 4px 10px; font-size: 12px; }
  table {
    width: 100%; background: #fff;
    border-collapse: collapse;
    border-radius: 8px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
  th { background: #fafafa; font-weight: 600; white-space: nowrap; font-size: 13px; }
  tr.repo-row:hover { background: #f9f9fb; }
  tr.repo-row.expanded { background: #f0f6ff; }
  .repo-name { font-family: monospace; font-weight: 600; color: #007aff; }
  a.repo-link { text-decoration: none; }
  a.repo-link:hover { text-decoration: underline; }
  .cron-badge {
    display: inline-block; padding: 2px 8px;
    background: #eef; color: #335;
    border-radius: 10px; font-family: monospace; font-size: 12px;
    margin-right: 4px;
  }
  .status-ok   { color: #34c759; font-weight: 600; }
  .status-bad  { color: #ff3b30; font-weight: 600; }
  .status-warn { color: #ff9500; font-weight: 600; }
  .status-off  { color: #8e8e93; }
  .health-dot {
    display: inline-block; font-size: 18px;
    cursor: pointer; user-select: none;
    line-height: 1;
  }
  .health-dot.green  { color: #34c759; }
  .health-dot.yellow { color: #ff9500; }
  .health-dot.red    { color: #ff3b30; }
  .health-dot.gray   { color: #ccc; }
  .health-dot:hover { opacity: .7; }
  input[type="text"], input[type="number"] {
    padding: 5px 8px;
    border: 1px solid #ddd; border-radius: 4px;
    font-size: 13px; font-family: inherit;
    background: #fff;
  }
  input:focus {
    outline: none; border-color: #007aff;
    box-shadow: 0 0 0 3px rgba(0,122,255,.15);
  }
  input:disabled { background: #f5f5f5; color: #999; }
  input.cron-input { width: 120px; font-family: monospace; }
  input.num-input  { width: 80px; }
  .detail-row { display: none; }
  .detail-row.visible { display: table-row; }
  .detail-row > td { padding: 0; background: #f8faff; }
  .detail-panel {
    padding: 16px 20px;
    border-top: 1px solid #d5e3ff;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
  }
  .detail-section {
    background: #fff; padding: 14px 16px;
    border-radius: 8px; border: 1px solid #e0e8f5;
  }
  .detail-section h4 {
    margin: 0 0 10px; font-size: 13px;
    color: #007aff; text-transform: uppercase;
    letter-spacing: .5px;
  }
  .form-row {
    display: flex; align-items: center;
    margin-bottom: 8px; gap: 8px;
  }
  .form-row label {
    flex: 0 0 90px; font-size: 13px;
    color: #666;
  }
  .form-row input[type="text"],
  .form-row input[type="number"] { flex: 1; }
  .form-row .hint { font-size: 12px; color: #999; }
  .progress-line {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .progress-line .label { flex: 0 0 60px; font-size: 13px; color: #666; }
  .progress-line .count { font-family: monospace; color: #888; }
  .progress-bar {
    flex: 1; height: 6px; background: #eee;
    border-radius: 3px; overflow: hidden;
    margin: 0 4px;
  }
  .progress-bar > div {
    height: 100%; background: #34c759;
    transition: width .3s;
  }
  .btn-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 8px;
  }
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-bg.visible { display: flex; }
  .modal {
    background: #fff; border-radius: 10px;
    max-width: 900px; width: 92%;
    max-height: 88vh; display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  .modal-header {
    padding: 16px 20px; border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h3 { margin: 0; font-size: 16px; }
  .modal-body {
    flex: 1; overflow-y: auto; padding: 16px 20px;
  }
  .modal-footer {
    padding: 12px 20px; border-top: 1px solid #eee;
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .modal-toolbar {
    padding: 10px 20px;
    background: #f9f9fb;
    border-bottom: 1px solid #eee;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .modal-toolbar .hint {
    font-size: 12px; color: #999; margin-left: auto;
  }
  .book-list {
    border: 1px solid #e0e0e0; border-radius: 6px;
    max-height: 400px; overflow-y: auto;
  }
  .book-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
  }
  .book-item:last-child { border-bottom: none; }
  .book-item.dragging { opacity: .4; }
  .book-item.drag-over { border-top: 2px solid #007aff; }
  .book-item .drag-handle {
    cursor: grab; color: #bbb; font-size: 16px;
    user-select: none; padding: 0 4px;
  }
  .book-item .drag-handle:active { cursor: grabbing; }
  .book-item .idx {
    flex: 0 0 40px; color: #999;
    font-family: monospace; font-size: 12px;
  }
  .book-item .name { flex: 1; word-break: break-all; }
  .book-item .name.done { color: #aaa; text-decoration: line-through; }
  .book-item .actions { display: flex; gap: 4px; }
  .section-title {
    font-size: 13px; font-weight: 600; color: #666;
    margin: 14px 0 6px;
    display: flex; align-items: center; gap: 10px;
  }
  .empty-hint {
    padding: 20px; text-align: center; color: #999; font-size: 13px;
  }
  #log {
    margin: 16px 0; padding: 12px;
    background: #1e1e1e; color: #d4d4d4;
    border-radius: 8px; font-family: Consolas, monospace;
    font-size: 12px; max-height: 300px; overflow-y: auto;
    white-space: pre-wrap; display: none;
  }
  #log.visible { display: block; }
  .hint { color: #888; font-size: 12px; margin-top: 6px; }
  .task-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: #fafbff;
    border: 1px solid #e0e8f5;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .task-row .task-label {
    flex: 0 0 120px;
    font-weight: 600; color: #007aff;
    font-size: 14px;
  }
  .task-row .task-lang {
    flex: 0 0 50px;
    font-size: 12px; color: #666;
    background: #eef; border-radius: 4px;
    padding: 2px 6px; text-align: center;
  }
  .task-row .task-cron {
    flex: 0 0 130px;
    font-family: monospace; font-size: 12px;
    color: #335;
  }
  .task-row .task-progress {
    flex: 1;
    display: flex; align-items: center; gap: 6px;
  }
  .task-row .task-progress .count {
    font-family: monospace; color: #888;
    font-size: 12px;
    min-width: 80px;
  }
  .task-row .task-actions {
    display: flex; gap: 6px;
  }
  .health-row {
    display: flex; padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
  }
  .health-row:last-child { border-bottom: none; }
  .health-row .k { flex: 0 0 100px; color: #666; font-weight: 600; }
  .health-row .v { flex: 1; }
  .health-icon-ok   { color: #34c759; }
  .health-icon-warn { color: #ff9500; }
  .health-icon-bad  { color: #ff3b30; }
  .health-suggestion {
    background: #fff8e6; border-left: 3px solid #ff9500;
    padding: 8px 12px; margin: 6px 0; border-radius: 4px;
    font-size: 13px;
  }
</style>
</head>
<body>

<h1>RSS 管理系统</h1>

<div class="toolbar">
  <button class="primary" onclick="saveConfig()">💾 保存配置</button>
  <button class="success" onclick="applyAll()">⚙️ 应用到各仓库</button>
  <button class="danger" onclick="pushAll()">📤 批量 Push</button>
  <select id="gearSelect" onchange="applyGear(this.value)"
          style="padding:7px 10px;font-size:13px;border-radius:6px;
                 border:1px solid #ddd;font-family:inherit;cursor:pointer">
    <option value="">切换档位...</option>
    <option value="1">前进一</option>
    <option value="2">前进二</option>
    <option value="3">前进三</option>
  </select>
  <span class="sep"></span>
  <button class="warn" onclick="syncProgressAll()">🔄 同步进度</button>
  <button class="warn" onclick="checkHealthAll()">🛠️ 全部检查</button>
  <span class="sep"></span>
  <button class="gray" onclick="reload()">🔄 刷新</button>
  <button class="gray" onclick="toggleLog()">📋 日志</button>
</div>

<div id="log"></div>

<table>
  <thead>
    <tr>
      <th style="width:30px"><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
      <th style="width:200px">仓库</th>
      <th>标题</th>
      <th style="width:110px">EPUB</th>
      <th style="width:110px">CSV</th>
      <th style="width:60px">健康</th>
      <th style="width:120px">状态</th>
      <th style="width:60px">操作</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr><td colspan="8" style="text-align:center;padding:40px;color:#999">加载中...</td></tr>
  </tbody>
</table>

<div class="hint">
  Cron 格式：<code>分 时 日 月 周</code>（UTC）。北京时间 = UTC + 8。<br>
  🟢 健康 · 🟡 警告 · 🔴 错误 · ⚪ 未检查（点「全部检查」）
</div>

<div class="modal-bg" id="booksModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="booksModalTitle">书籍管理</h3>
      <button class="gray small" onclick="closeBooksModal()">✕</button>
    </div>
    <div class="modal-toolbar">
      <button class="primary small" onclick="rebuildManifest()">🔄 从目录重建 manifest</button>
      <button class="gray small" onclick="refreshBooks()">↻ 刷新</button>
      <span class="hint">资源管理器换完书后，点「重建」</span>
    </div>
    <div class="modal-body" id="booksModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeBooksModal()">取消</button>
      <button class="primary" onclick="saveBookOrder()">保存顺序</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="taskModal">
  <div class="modal" style="max-width:700px">
    <div class="modal-header">
      <h3 id="taskModalTitle">编辑任务</h3>
      <button class="gray small" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="modal-body" id="taskModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeTaskModal()">取消</button>
      <button class="primary" onclick="saveTaskConfig()">保存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="createTaskModal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3>新建 CSV 任务</h3>
      <button class="gray small" onclick="closeCreateTaskModal()">✕</button>
    </div>
    <div class="modal-body" id="createTaskModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeCreateTaskModal()">取消</button>
      <button class="primary" onclick="submitCreateTask()">创建</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="healthModal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h3 id="healthModalTitle">健康检查</h3>
      <button class="gray small" onclick="closeHealthModal()">✕</button>
    </div>
    <div class="modal-body" id="healthModalBody">加载中...</div>
    <div class="modal-footer">
      <button class="gray" onclick="closeHealthModal()">关闭</button>
      <button class="primary" onclick="rerunHealthCheck()">重新检查</button>
    </div>
  </div>
</div>

<script>
let config = null;
let repoInfos = {};
let statuses = {};
let healths = {};
let currentBooksRepo = null;
let currentBookList = null;
let currentHealthRepo = null;
let pendingProgress = null;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const text = await r.text();
  try { return JSON.parse(text); } catch { return { raw: text }; }
}

function log(msg) {
  const el = document.getElementById('log');
  el.classList.add('visible');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function toggleLog() {
  document.getElementById('log').classList.toggle('visible');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtCron(c) {
  return '<span class="cron-badge">' + escapeHtml(c || '—') + '</span>';
}

async function reload() {
  config = await api('/api/config');
  statuses = await api('/api/status');
  repoInfos = {};
  for (const name of Object.keys(config.repos || {})) {
    repoInfos[name] = await api('/api/repo-info/' + name);
  }
  render();
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  for (const [name, cfg] of Object.entries(config.repos || {})) {
    const info = repoInfos[name] || {};
    const st = statuses[name] || {};
    const health = healths[name] || null;
    const isTaskRepo = info.tasks && info.tasks.length > 0;

    let statusHtml = '<span class="status-off">未知</span>';
    if (!st.exists) {
      statusHtml = '<span class="status-bad">目录缺失</span>';
    } else {
      const parts = [];
      if (st.ahead > 0) parts.push('<span class="status-warn">未推 ' + st.ahead + '</span>');
      if (st.local > 0) parts.push('<span class="status-warn">本地改 ' + st.local + '</span>');
      statusHtml = parts.length ? parts.join(' / ') :
        '<span class="status-ok">干净</span>';
    }

    let healthHtml = '<span class="health-dot gray">⚪</span>';
    if (health) {
      const icon = health.level === 'green' ? '🟢'
                 : health.level === 'yellow' ? '🟡' : '🔴';
      healthHtml = '<span class="health-dot ' + health.level + '" onclick="openHealthModal(\'' + name + '\')">' + icon + '</span>';
    }

    const enabled = cfg.enabled !== false;
    const enabledBadge = enabled ? '' :
      '<span class="status-off" style="font-size:11px">(已停)</span>';

    let epubCol, csvCol;
    if (isTaskRepo) {
      epubCol = '<span class="status-off">/</span>';
      csvCol = '<span class="status-off">/</span>';
    } else {
      epubCol = fmtCron(cfg.cron?.epub);
      csvCol = fmtCron(cfg.cron?.csv);
    }

    const tr = document.createElement('tr');
    tr.className = 'repo-row';
    tr.dataset.repo = name;
    tr.innerHTML =
      '<td><input type="checkbox" class="row-check" data-repo="' + name + '"></td>' +
      '<td><a class="repo-name repo-link" href="https://github.com/ZHENHUA001A307/' + escapeHtml(name) + '" target="_blank" rel="noopener">' + escapeHtml(name) + '</a> ' + enabledBadge + '</td>' +
      '<td>' + escapeHtml(cfg.feed?.title || '') + '</td>' +
      '<td style="text-align:center">' + epubCol + '</td>' +
      '<td style="text-align:center">' + csvCol + '</td>' +
      '<td>' + healthHtml + '</td>' +
      '<td class="status-cell">' + statusHtml + '</td>' +
      '<td><button class="gray small" onclick="toggleDetail(\'' + name + '\', this)">▼</button></td>';
    tbody.appendChild(tr);

    const dr = document.createElement('tr');
    dr.className = 'detail-row';
    dr.dataset.detail = name;
    dr.innerHTML = '<td colspan="8">' + renderDetail(name, cfg, info) + '</td>';
    tbody.appendChild(dr);
  }
}

function renderDetail(name, cfg, info) {
  if (info.tasks && info.tasks.length > 0) {
    return renderTaskDetail(name, cfg, info);
  }
  const epubTotal = info.epub?.total || 0;
  const epubProg = info.epub?.progress || 0;
  const epubDis = info.epub?.disabled || 0;
  const csvTotal = info.csv?.total || 0;
  const csvProg = info.csv?.progress || 0;
  const enabled = cfg.enabled !== false;
  const epubPct = epubTotal > 0 ? Math.min(100, epubProg / epubTotal * 100) : 0;
  const csvPct = csvTotal > 0 ? Math.min(100, csvProg / csvTotal * 100) : 0;

  return `
  <div class="detail-panel">
    <div class="detail-section">
      <h4>基础</h4>
      <div class="form-row">
        <label>标题</label>
        <input type="text" data-repo="${name}" data-field="title" value="${escapeHtml(cfg.feed?.title || '')}">
      </div>
      <div class="form-row">
        <label>描述</label>
        <input type="text" data-repo="${name}" data-field="description" value="${escapeHtml(cfg.feed?.description || '')}">
      </div>
      <div class="form-row">
        <label>启用</label>
        <input type="checkbox" data-repo="${name}" data-field="enabled" ${enabled ? 'checked' : ''}>
        <span class="hint">关闭后不会按 cron 自动跑</span>
      </div>
    </div>
    <div class="detail-section">
      <h4>推送时间（UTC）</h4>
      <div class="form-row">
        <label>EPUB</label>
        <input type="text" class="cron-input" data-repo="${name}" data-field="cron_epub" value="${escapeHtml(cfg.cron?.epub || '')}">
      </div>
      <div class="form-row">
        <label>CSV</label>
        <input type="text" class="cron-input" data-repo="${name}" data-field="cron_csv" value="${escapeHtml(cfg.cron?.csv || '')}">
      </div>
    </div>
    <div class="detail-section">
      <h4>阅读参数</h4>
      <div class="form-row">
        <label>EPUB速度</label>
        <input type="number" class="num-input" data-repo="${name}" data-field="speed_epub" value="${cfg.epub?.reading_speed || 300}">
        <span class="hint">字/分</span>
      </div>
      <div class="form-row">
        <label>每日预算</label>
        <input type="number" class="num-input" data-repo="${name}" data-field="budget_epub" value="${cfg.epub?.daily_budget_min || 30}">
        <span class="hint">分钟</span>
      </div>
      <div class="form-row">
        <label>优先级</label>
        <input type="number" class="num-input" data-repo="${name}" data-field="priority_epub" value="${cfg.epub?.priority || 5}" min="1" max="10">
      </div>
    </div>
    <div class="detail-section">
      <h4>进度</h4>
      <div class="progress-line">
        <span class="label">EPUB</span>
        <div class="progress-bar"><div style="width:${epubPct}%"></div></div>
        <span class="count">${epubProg} / ${epubTotal}</span>
        <input type="number" class="num-input" style="width:60px" data-repo="${name}" data-field="progress_epub" value="${epubProg}">
        <button class="gray small" onclick="resetProgress('${name}','epub')">重置</button>
      </div>
      <div class="progress-line">
        <span class="label">CSV</span>
        <div class="progress-bar"><div style="width:${csvPct}%"></div></div>
        <span class="count">${csvProg} / ${csvTotal}</span>
        <input type="number" class="num-input" style="width:60px" data-repo="${name}" data-field="progress_csv" value="${csvProg}">
        <button class="gray small" onclick="resetProgress('${name}','csv')">重置</button>
      </div>
      <div class="btn-row">
        <button class="primary small" onclick="saveProgress('${name}')">保存进度</button>
        <button class="warn small" onclick="syncProgressOne('${name}')">🔄 同步远程进度</button>
      </div>
    </div>
    <div class="detail-section">
      <h4>内容管理</h4>
      <div class="btn-row">
        <button class="gray small" onclick="openBooksModal('${name}')">
          📚 管理 EPUB 书籍 (${epubTotal} 启用 / ${epubDis} 搁置)
        </button>
      </div>
      <div class="hint">CSV 请用本地编辑器直接改 data/source.csv</div>
    </div>
    <div class="detail-section">
      <h4>快捷操作</h4>
      <div class="btn-row">
        <button class="success small" onclick="triggerWorkflow('${name}','epub')">▶ 触发 EPUB</button>
        <button class="success small" onclick="triggerWorkflow('${name}','csv')">▶ 触发 CSV</button>
      </div>
      <div class="btn-row">
        <button class="gray small" onclick="openHealthModal('${name}')">🛠️ 检查健康</button>

        <button class="gray small" onclick="window.open('https://cdn.jsdelivr.net/gh/ZHENHUA001A307/${name}@main/feed.xml','_blank')">预览 Feed</button>

function collectEdits() {
  document.querySelectorAll('.detail-row input[data-repo]').forEach(inp => {
    const repo = inp.dataset.repo;
    const field = inp.dataset.field;
    const cfg = config.repos[repo];
    if (!cfg) return;
    if (field === 'title')       { cfg.feed = cfg.feed || {}; cfg.feed.title = inp.value; }
    if (field === 'description') { cfg.feed = cfg.feed || {}; cfg.feed.description = inp.value; }
    if (field === 'enabled')     { cfg.enabled = inp.checked; }
    if (field === 'cron_epub')   { cfg.cron = cfg.cron || {}; cfg.cron.epub = inp.value; }
    if (field === 'cron_csv')    { cfg.cron = cfg.cron || {}; cfg.cron.csv = inp.value; }
    if (field === 'speed_epub')  { cfg.epub = cfg.epub || {}; cfg.epub.reading_speed = parseInt(inp.value) || 300; }
    if (field === 'budget_epub') { cfg.epub = cfg.epub || {}; cfg.epub.daily_budget_min = parseInt(inp.value) || 30; }
    if (field === 'priority_epub') { cfg.epub = cfg.epub || {}; cfg.epub.priority = parseInt(inp.value) || 5; }
  });
}

async function resetProgress(name, mode) {
  if (!confirm('确定要把 ' + name + ' 的 ' + mode.toUpperCase() + ' 进度重置为 0？')) return;
  pendingProgress = { name, mode, value: 0 };
  await doProgressChange();
}

async function saveProgress(name) {
  const inp = document.querySelector('input[data-repo="' + name + '"][data-field="progress_epub"]');
  const inpCsv = document.querySelector('input[data-repo="' + name + '"][data-field="progress_csv"]');
  const info = repoInfos[name];
  const origEpub = info.epub?.progress || 0;
  const origCsv = info.csv?.progress || 0;
  const newEpub = parseInt(inp.value) || 0;
  const newCsv = parseInt(inpCsv.value) || 0;
  let validEpub = newEpub;
  let validCsv = newCsv;
  if (newEpub > (info.epub?.total || 0)) { validEpub = 0; }
  if (newCsv > (info.csv?.total || 0)) { validCsv = 0; }
  const tasks = [];
  if (validEpub !== origEpub) tasks.push({ mode: 'epub', value: validEpub, orig: origEpub });
  if (validCsv !== origCsv)  tasks.push({ mode: 'csv',  value: validCsv,  orig: origCsv });
  if (tasks.length === 0) { log('无进度变化'); return; }
  for (const t of tasks) {
    const preview = await api('/api/preview/' + name + '/' + t.mode + '?from=' + t.value + '&count=5');
    const lines = preview.map(p => '  ' + p.index + '. ' + p.title).join('\n') || '  (无)';
    const msg = '【' + name + ' / ' + t.mode.toUpperCase() + '】\n' +
                '进度将从 ' + t.orig + ' 改为 ' + t.value + '\n' +
                (t.value === 0 && t.orig > 0 ? '⚠️ 这会重推整个列表\n' : '') +
                '\n若从新进度开始推送，未来 5 条是：\n' + lines + '\n\n确认？';
    if (!confirm(msg)) { log('取消进度修改'); return; }
  }
  for (const t of tasks) {
    const r = await api('/api/progress/' + name, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ mode: t.mode, value: t.value })
    });
    log(r.ok ? '✅ 进度已改为 ' + t.value : '❌ 失败');
  }
  await reload();
}

async function doProgressChange() {
  const { name, mode, value } = pendingProgress;
  const r = await api('/api/progress/' + name, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ mode, value })
  });
  log(r.ok ? '✅ 进度已改为 ' + value : '❌ 失败');
  pendingProgress = null;
  await reload();
}

async function editTaskProgress(name, taskId, current, total) {
  const input = prompt('输入新的进度值（当前 ' + current + ' / ' + total + '）', current);
  if (input === null) return;
  const val = parseInt(input);
  if (isNaN(val) || val < 0) { log('❌ 无效数字'); return; }

  let finalVal = val;
  if (val > total) {
    if (!confirm('进度 ' + val + ' 超过总量 ' + total + '，将重置为 0。继续？')) return;
    finalVal = 0;
  }

  const preview = await api('/api/preview-task/' + name + '/' + taskId + '?from=' + finalVal + '&count=5');
  if (preview && preview.length > 0) {
    const lines = preview.map(p => '  ' + p.index + '. ' + p.title).join('\n');
    if (!confirm('若从新进度开始推送，未来 5 条是：\n' + lines + '\n\n确认？')) return;
  }

  const r = await api('/api/task-progress/' + name + '/' + taskId, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ value: finalVal })
  });
  log(r.ok ? '✅ ' + taskId + ' 进度已改为 ' + finalVal : '❌ 失败');
  await reload();
}

    lang: document.getElementById('tf_lang').value.trim(),

function getTaskType(repoName, taskId) {
  const cfg = config.repos[repoName];
  if (!cfg || !cfg.tasks) return '';
  const t = cfg.tasks.find(x => x.id === taskId);
  return t ? (t.type || '') : '';
}

function slugify(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

    document.getElementById('healthModalBody').innerHTML = '无数据';

  const levelIcon = h.level === 'green' ? '🟢'
                  : h.level === 'yellow' ? '🟡' : '🔴';
  let html = '<div style="font-size:24px;text-align:center;margin:8px 0 16px">' + levelIcon + '</div>';
  html += '<div class="health-row"><span class="k">Actions</span><span class="v">' + icon(h.actions.ok) + ' ' + escapeHtml(h.actions.msg) + '</span></div>';
  html += '<div class="health-row"><span class="k">本地</span><span class="v">' + icon(h.git.ok) + ' ' + escapeHtml(h.git.msg) + '</span></div>';

  let progDetail = escapeHtml(h.progress.msg);
  if (h.progress.tasks && h.progress.tasks.length > 0) {
    for (const t of h.progress.tasks) {
      const diffMark = t.diff ? ' ⚠️' : '';
      progDetail += '<br><span style="color:#888;font-size:12px">' +
                    escapeHtml(t.label) + ': 本地=' + (t.local ?? '—') +
                    ' 远程=' + (t.remote ?? '—') + diffMark + '</span>';
    }
  }
  html += '<div class="health-row"><span class="k">进度</span><span class="v">' + icon(h.progress.ok) + ' ' + progDetail + '</span></div>';
  html += '<div class="health-row"><span class="k">Feed</span><span class="v">' + icon(h.feed.ok) + ' ' + escapeHtml(h.feed.msg) + '</span></div>';
  html += '<div class="health-row"><span class="k">网络</span><span class="v">' + icon(h.network.ok) + ' ' + escapeHtml(h.network.msg) + '</span></div>';
  if (h.suggestions && h.suggestions.length > 0) {
    html += '<div style="margin-top:16px;font-size:13px;font-weight:600;color:#666">建议操作：</div>';
    for (const s of h.suggestions) {
      html += '<div class="health-suggestion">' + escapeHtml(s) + '</div>';
    }
  }
  document.getElementById('healthModalBody').innerHTML = html;

async function openBooksModal(name) {

function closeBooksModal() {
  document.getElementById('booksModal').classList.remove('visible');
  currentBooksRepo = null;
  currentBookList = null;
}

async function refreshBooks() {
  if (!currentBooksRepo) return;
  currentBookList = await api('/api/books/' + currentBooksRepo);

  await reload();

async function rebuildManifest() {
  if (!currentBooksRepo) return;
  if (!confirm('重建 ' + currentBooksRepo + ' 的 manifest？\n\n' +
               '会扫描 books/ 目录下的所有 .epub 文件，按文件名排序，\n' +
               '覆盖当前 manifest.json。当前顺序会丢失。')) return;
  log('⏳ 重建 ' + currentBooksRepo + ' 的 manifest...');
  const r = await api('/api/books/' + currentBooksRepo + '/rebuild-manifest', { method: 'POST' });
  if (!r.ok) { log('❌ ' + (r.error || '重建失败')); return; }
  log('✅ ' + (r.output || '重建成功'));
  currentBookList = await api('/api/books/' + currentBooksRepo);
  renderBooksModal();
  await reload();
}

function renderBooksModal() {
  const { enabled, disabled, orphans } = currentBookList;
  const progress = (repoInfos[currentBooksRepo]?.epub?.progress) || 0;
  let html = '';
  html += '<div class="section-title">启用列表 (' + enabled.length + ') — 拖动 ⠿ 调整顺序</div>';
  if (enabled.length === 0) {
    html += '<div class="empty-hint">无启用书籍。点上方「从目录重建 manifest」。</div>';
  } else {
    html += '<div class="book-list" id="enabledList">';
    for (const it of enabled) {
      const done = it.index <= progress;
      const safeFile = escapeHtml(it.file).replace(/'/g, "\\'");
      html += '<div class="book-item" draggable="true" data-file="' + escapeHtml(it.file) + '">' +
              '<span class="drag-handle">⠿</span>' +
              '<span class="idx">' + it.index + '</span>' +
              '<span class="name ' + (done ? 'done' : '') + '">' + escapeHtml(it.title || it.file) + '</span>' +
              '<span class="actions">' +
                '<button class="gray small" onclick="disableBook(\'' + safeFile + '\')">搁置</button>' +
              '</span></div>';
    }
    html += '</div>';
  }
  if (disabled.length > 0) {
    html += '<div class="section-title">搁置区 (' + disabled.length + ')</div>';
    html += '<div class="book-list">';
    for (const it of disabled) {
      const safeFile = escapeHtml(it.file).replace(/'/g, "\\'");
      html += '<div class="book-item">' +
              '<span class="idx">—</span>' +
              '<span class="name">' + escapeHtml(it.title || it.file) + '</span>' +
              '<span class="actions">' +
                '<button class="success small" onclick="enableBook(\'' + safeFile + '\')">恢复</button>' +
                '<button class="danger small" onclick="deleteBook(\'' + safeFile + '\')">彻底删除</button>' +
              '</span></div>';
    }
    html += '</div>';
  }
  if (orphans.length > 0) {
    html += '<div class="section-title">孤立文件 (' + orphans.length + ')' +
            '<button class="primary small" onclick="enableAllOrphans()">全部加入</button></div>';
    html += '<div class="book-list">';
    for (const it of orphans) {
      const safeFile = escapeHtml(it.file).replace(/'/g, "\\'");
      html += '<div class="book-item">' +
              '<span class="idx">!</span>' +
              '<span class="name">' + escapeHtml(it.file) + '</span>' +
              '<span class="actions">' +
                '<button class="success small" onclick="enableBook(\'' + safeFile + '\')">加入</button>' +
              '</span></div>';
    }
    html += '</div>';
  }
  document.getElementById('booksModalBody').innerHTML = html;
  setupDragDrop();
}

function setupDragDrop() {
  const list = document.getElementById('enabledList');
  if (!list) return;
  let dragEl = null;
  list.querySelectorAll('.book-item').forEach(el => {
    el.addEventListener('dragstart', e => { dragEl = el; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      list.querySelectorAll('.book-item').forEach(x => x.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      if (el === dragEl) return;
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      if (el === dragEl) return;
      const items = [...list.querySelectorAll('.book-item')];
      const from = items.indexOf(dragEl);
      const to = items.indexOf(el);
      if (from < to) el.after(dragEl);
      else el.before(dragEl);
      [...list.querySelectorAll('.book-item')].forEach((it, i) => {
        it.querySelector('.idx').textContent = i + 1;
      });
    });
  });
}

async function saveBookOrder() {
  const list = document.getElementById('enabledList');
  if (!list) { closeBooksModal(); return; }
  const files = [...list.querySelectorAll('.book-item')].map(el => el.dataset.file);
  const r = await api('/api/books/' + currentBooksRepo + '/reorder', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ files })
  });
  log(r.ok ? '✅ 顺序已保存' : '❌ 保存失败：' + r.error);
  closeBooksModal();
  await reload();
}
